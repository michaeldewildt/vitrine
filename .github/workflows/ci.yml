name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install
      - name: Typecheck (strict tsc)
        run: bun run typecheck
      - name: Test (hermetic suite)
        run: bun run test
      - name: Test (bench suite)
        run: bun run test:bench
